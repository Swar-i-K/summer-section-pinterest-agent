name: Summer Section Pinterest Agent

on:
  workflow_dispatch:
    inputs:
      article_url:
        description: "Public WordPress article URL"
        required: true
        type: string
      pins_per_article:
        description: "How many pins to create (1-15)"
        required: false
        default: "10"
        type: string
      use_ai_backgrounds:
        description: "Use AI-generated background imagery when OPENAI_API_KEY is configured"
        required: false
        default: true
        type: boolean

permissions:
  contents: read

jobs:
  generate-pinterest-campaign:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Generate campaign
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GROQ_MODEL: ${{ vars.GROQ_MODEL }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ARTICLE_URL: ${{ inputs.article_url }}
          USE_AI_BACKGROUNDS: ${{ inputs.use_ai_backgrounds }}
          PINS_PER_ARTICLE: ${{ inputs.pins_per_article }}
          OUTPUT_DIR: output
        run: python -m agent.main

      - name: Upload campaign artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: summer-section-pinterest-campaign
          path: output/
          if-no-files-found: warn
          retention-days: 3
